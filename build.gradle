plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
    id 'java'
}

// The pushed tag (v1.2.3) is the single source of truth for the version. A local build on an
// exact tag uses that tag too; otherwise it falls back to gradle.properties. Override locally
// with -Pmod_version=1.2.3.
def resolveVersion = { ->
    def tag = System.getenv('GITHUB_REF_TYPE') == 'tag' ? System.getenv('GITHUB_REF_NAME') : null
    if (tag == null) {
        try {
            tag = providers.exec {
                commandLine 'git', 'describe', '--tags', '--exact-match'
                ignoreExitValue = true
            }.standardOutput.asText.get().trim()
        } catch (Exception ignored) {
            tag = null
        }
    }
    return (tag != null && tag.startsWith('v')) ? tag.substring(1) : project.mod_version
}
version = resolveVersion()
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
}

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    // Only for runClient: the real mod is required at runtime, players install it themselves.
    runtimeOnly "maven.modrinth:simple-voice-chat:fabric-${project.voicechat_api_version}+${project.minecraft_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
}

test {
    useJUnitPlatform()
}
